  - name: 'high-priority'
    # Webhook disabled until proper endpoint is set up
    # webhook_configs:
    #   - url: 'http://your-webhook-endpoint/api/alerts/high'
    #     send_resolved: true

  # Project-specific receivers
  - name: 'gold-predictor-team'
    # Webhook disabled until proper endpoint is set up
