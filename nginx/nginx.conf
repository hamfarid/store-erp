        # ===== Management Tools (Commented - Enable when services running) =====
        # location /portainer/ {
        #     rewrite ^/portainer/(.*) /$1 break;
        #     proxy_pass http://portainer;
        #     proxy_http_version 1.1;
        #     proxy_set_header Upgrade $http_upgrade;
