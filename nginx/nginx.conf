                    <tr><td>ERP</td><td class="port">5001</td><td class="port">5501</td><td class="port">8083</td></tr>
                    <tr><td>Store</td><td class="port">6001</td><td class="port">6501</td><td class="port">8084</td></tr>
                </table>
            </div>
            <div class="card">
                <h2>📈 المراقبة</h2>
