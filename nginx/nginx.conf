            proxy_read_timeout 600s;
        }
        location /gold/qdrant/ {
            set $gold_qdrant gold-price-predictor-qdrant:6333;
            rewrite ^/gold/qdrant/(.*) /$1 break;
            proxy_pass http://$gold_qdrant;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_read_timeout 300s;
        }

        # ===== Project 3: Zakat =====
        location /zakat/ {
            set $zakat_frontend zakat-frontend:80;
            rewrite ^/zakat/(.*) /$1 break;
            proxy_pass http://$zakat_frontend;
