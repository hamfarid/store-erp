                    <tr><td>Grafana</td><td class="port">3000</td></tr>
                    <tr><td>Prometheus</td><td class="port">9090</td></tr>
                    <tr><td>Alertmanager</td><td class="port">9093</td></tr>
                    <tr><td>Portainer</td><td class="port">9000</td></tr>
                </table>
            </div>
        </div>
    </div>
</body>
</html>';
        }
    }

    # Include additional configurations
    include /etc/nginx/conf.d/*.conf;
}
