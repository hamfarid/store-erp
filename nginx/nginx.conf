        .port { color: #00d4ff; font-weight: bold; font-family: monospace; }
        a { color: #00ff88; text-decoration: none; }
        .status { 
            display: inline-block; 
            padding: 5px 15px; 
            border-radius: 20px; 
            background: #00ff88; 
            color: #1a1a2e; 
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 لوحة تحكم Nginx</h1>
        <div class="grid">
            <div class="card">
                <h2>📊 حالة الخادم</h2>
                <p><a href="/nginx_status">عرض حالة Nginx</a></p>
