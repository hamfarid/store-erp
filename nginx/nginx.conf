# =============================================================================
# Nginx Configuration - Unified Gateway for All AI Projects
# =============================================================================
# Network: Ai_project
# Updated: 2026-01-19
# Uses dynamic DNS resolution for upstream services
# =============================================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # DNS resolver for dynamic upstream resolution
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    log_format json '{"time":"$time_iso8601",'
                    '"remote_addr":"$remote_addr",'
                    '"request":"$request",'
                    '"status":"$status",'
                    '"body_bytes_sent":"$body_bytes_sent",'
                    '"request_time":"$request_time",'
                    '"upstream_response_time":"$upstream_response_time"}';

    access_log /var/log/nginx/access.log main;

    # Performance settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 100M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript 
               application/rss+xml application/atom+xml image/svg+xml;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=ml_limit:10m rate=10r/s;

    # ==========================================================================
    # UPSTREAM DEFINITIONS - Management Tools (Commented - Enable when running)
    # ==========================================================================
    # upstream portainer {
    #     server portainer:9000;
    # }
    # upstream grafana {
    #     server grafana:3000;
    # }
    # upstream prometheus {
    #     server prometheus:9090;
    # }
    # upstream alertmanager {
    #     server alertmanager:9093;
    # }

    # ==========================================================================
    # MAIN SERVER - PORT 80 (Unified Gateway)
    # ==========================================================================
    server {
        listen 80;
        server_name localhost;

        # Health check
        location /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # API status
        location /api/status {
            default_type application/json;
            return 200 '{"status":"healthy","nginx":"running","timestamp":"$time_iso8601","projects":6}';
        }

        # ===== Project 1: Test Projects =====
        location /test/ {
            set $test_frontend test-frontend:1501;
            rewrite ^/test/(.*) /$1 break;
            proxy_pass http://$test_frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /test/api/ {
            set $test_backend test-backend:1051;
            limit_req zone=api_limit burst=20 nodelay;
            rewrite ^/test/api/(.*) /api/$1 break;
            proxy_pass http://$test_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 300s;
        }

        # ===== Project 2: Gold Price Predictor =====
        location /gold/ {
            set $gold_frontend gold-price-predictor-frontend:2501;
            rewrite ^/gold/(.*) /$1 break;
            proxy_pass http://$gold_frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        location /gold/api/ {
            set $gold_backend gold-price-predictor-backend:2001;
            limit_req zone=api_limit burst=20 nodelay;
            rewrite ^/gold/api/(.*) /api/$1 break;
            proxy_pass http://$gold_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 300s;
        }
        location /gold/ml/ {
            set $gold_ml gold-price-predictor-ml:2101;
            limit_req zone=ml_limit burst=10 nodelay;
            rewrite ^/gold/ml/(.*) /$1 break;
            proxy_pass http://$gold_ml;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_read_timeout 600s;
            client_max_body_size 100M;
        }
        location /gold/ai/ {
            set $gold_ai gold-price-predictor-ai:2601;
            limit_req zone=ml_limit burst=10 nodelay;
            rewrite ^/gold/ai/(.*) /$1 break;
