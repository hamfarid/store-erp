# =============================================================================
# Inventory Store System - Docker Compose Configuration
# =============================================================================
# Configured for Ai_project shared network
# Port Assignment: Project 6 -> Backend: 6001, Frontend: 6501
# Updated: 2026-02-06
# =============================================================================

services:
  # ===========================================================================
  # PostgreSQL Database
  # ===========================================================================
  database:
    image: postgres:15-alpine
    container_name: store_database
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-inventory_db}
      POSTGRES_USER: ${POSTGRES_USER:-inventory_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${DATABASE_PORT:-12502}:5432"
    networks:
      - Ai_project
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory_user -d inventory_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ===========================================================================
  # Redis Cache
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: store_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6376}:6379"
    volumes:
      - redis_data:/data
    networks:
      - Ai_project
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ===========================================================================
  # Backend API (Flask + Gunicorn)
  # ===========================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: store_backend
    restart: unless-stopped
    environment:
      - FLASK_ENV=production
      - FLASK_DEBUG=0
      - DATABASE_URL=postgresql://${POSTGRES_USER:-inventory_user}:${POSTGRES_PASSWORD}@store_database:5432/${POSTGRES_DB:-inventory_db}
      - DB_HOST=store_database
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB:-inventory_db}
      - DB_USER=${POSTGRES_USER:-inventory_user}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      - REDIS_URL=redis://store_redis:6379/0
      - CORS_ORIGINS=http://localhost:6501,http://store_frontend,http://store_frontend:80
      - HOST=0.0.0.0
      - PORT=5000
      - TZ=${TZ:-Africa/Cairo}
      - LANGUAGE=${LANGUAGE:-ar}
      - CURRENCY=${CURRENCY:-EGP}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - backend_uploads:/app/uploads
      - backend_logs:/app/logs
      - backend_backups:/app/backups
      - backend_instance:/app/instance
    ports:
      - "${BACKEND_PORT:-6001}:5000"
    networks:
      - Ai_project
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ===========================================================================
  # Frontend (React + Nginx)
  # ===========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=
    container_name: store_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-6501}:80"
    networks:
      - Ai_project
    deploy:
      resources:
        limits:
          memory: 256M
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

# =============================================================================
# Networks - Using external Ai_project network
# =============================================================================
networks:
  Ai_project:
    external: true

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  backend_uploads:
    driver: local
  backend_logs:
    driver: local
  backend_backups:
    driver: local
  backend_instance:
    driver: local
