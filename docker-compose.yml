# =============================================================================
# Inventory Store System - Docker Compose Configuration
# =============================================================================
# Configured for Ai_project shared network
# Port Assignment: Project 6 -> Backend: 6001, Frontend: 6501
# Updated: 2026-01-19
# =============================================================================

services:
  # ===========================================================================
  # PostgreSQL Database
  # ===========================================================================
  database:
    image: postgres:15-alpine
    container_name: store_database
    restart: unless-stopped
    environment:
      POSTGRES_DB: inventory_db
      POSTGRES_USER: inventory_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inventory_password}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "12502:5432"
    networks:
      - Ai_project
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U inventory_user -d inventory_db" ]
      interval: 30s
      timeout: 10s
      retries: 5

  # ===========================================================================
  # Backend API (Flask)
  # ===========================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: store_backend
    restart: unless-stopped
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=postgresql://inventory_user:${POSTGRES_PASSWORD:-inventory_password}@store_database:5432/inventory_db
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-here}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-jwt-secret-key-here}
      - REDIS_URL=redis://store_redis:6379/0
      - CORS_ORIGINS=http://localhost:6501,http://nginx-proxy,http://localhost:80
    volumes:
      - backend_uploads:/app/uploads
      - backend_logs:/app/logs
      - backend_backups:/app/backups
      - backend_sessions:/app/flask_session
    ports:
      - "6002:5000"
    networks:
      - Ai_project
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5000/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ===========================================================================
  # Frontend (React + Nginx)
  # ===========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: store_frontend
    restart: unless-stopped
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:6002/api}
    ports:
      - "6501:80"
    networks:
      - Ai_project
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost/" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===========================================================================
  # Redis Cache
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: store_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6376:6379"
    volumes:
      - redis_data:/data
    networks:
      - Ai_project
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 30s
      timeout: 10s
      retries: 3

# =============================================================================
# Networks - Using external Ai_project network
# =============================================================================
networks:
  Ai_project:
    external: true

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  backend_uploads:
    driver: local
  backend_logs:
    driver: local
  backend_backups:
    driver: local
  backend_sessions:
    driver: local
