# =============================================================================
# Ruff Configuration for Ai_Project
# =============================================================================
# Based on CONSTITUTION.md - Code Quality Principles
# Ruff is an extremely fast Python linter, written in Rust
# Docs: https://docs.astral.sh/ruff/
# =============================================================================

# Target Python version
target-version = "py311"

# Line length (CONSTITUTION Article 1: Small Functions)
line-length = 120

# Exclude common directories
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "migrations",
    "*.egg-info",
    # This repo contains multiple copies of global guideline packs; exclude them from linting.
    "global_v*",
    "github",
]

[lint]
# Enable specific rule sets
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "ERA",    # eradicate (commented-out code)
    "PL",     # Pylint
    "RUF",    # Ruff-specific rules
]

# Ignore specific rules
ignore = [
    "E501",   # Line too long (handled by formatter)
    "E731",   # Lambda assignment (allow for decorators/fallbacks)
    "PLR0913", # Too many arguments
    "PLR2004", # Magic value comparison
    "B008",   # Function call in default argument
    "ARG001", # Unused function argument
    "ARG002", # Unused method argument
]

# Allow autofix for all enabled rules
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[lint.per-file-ignores]
# Ignore import violations in __init__.py files
"__init__.py" = ["F401", "F403"]
# Ignore star imports in Django settings
"*/settings/*.py" = ["F401", "F403", "F405"]
"settings.py" = ["F401", "F403", "F405"]
# Ignore unused imports in type checking blocks
"*.pyi" = ["F401"]

[lint.isort]
# CONSTITUTION Article 3: Consistent import organization
known-first-party = ["src", "app", "gaara_erp", "core", "api"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]
force-single-line = false
lines-after-imports = 2

[lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]

[lint.pylint]
max-args = 10
max-branches = 15
max-returns = 8
max-statements = 60

[format]
# Use double quotes for strings
quote-style = "double"
# Indent with spaces
indent-style = "space"
# Respect magic trailing commas
skip-magic-trailing-comma = false
# Unix-style line endings
line-ending = "auto"

