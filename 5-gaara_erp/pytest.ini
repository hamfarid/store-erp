[pytest]
# Project-level pytest configuration for 5-gaara_erp.
#
# This repo contains multiple Python apps (Django + utilities/scripts).
# To keep test runs stable, we restrict discovery to the Django test suite.
#
# Notes:
# - We intentionally avoid pytest-django specific ini keys here.
#   Django bootstrapping (settings + test DB) is handled in gaara_erp/conftest.py.

testpaths =
    gaara_erp/tests

python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -q
    --tb=short


