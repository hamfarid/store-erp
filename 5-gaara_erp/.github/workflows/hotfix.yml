# FILE: .github/workflows/hotfix.yml | PURPOSE: Emergency hotfix workflow | OWNER: DevOps Team | RELATED: deploy-production.yml | LAST-AUDITED: 2026-02-05

name: 🚨 الإصلاحات الطارئة (Hotfix)

on:
  push:
    branches:
      - 'hotfix/**'
  workflow_dispatch:
    inputs:
      skip_staging:
        description: '⚠️ تخطي Staging (للطوارئ القصوى فقط)'
        type: boolean
        default: false
      hotfix_description:
        description: 'وصف الإصلاح الطارئ'
        required: true
        type: string

concurrency:
  group: hotfix-emergency
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.11'
  PRODUCTION_URL: 'https://gaara-erp.com'
  STAGING_URL: 'https://staging.gaara-erp.com'

jobs:
  # ═══════════════════════════════════════════════════════════════
  # 🔍 التحقق السريع
  # ═══════════════════════════════════════════════════════════════
  validate:
    name: 🔍 التحقق السريع
    runs-on: ubuntu-latest
    outputs:
      hotfix_version: ${{ steps.version.outputs.version }}
      is_critical: ${{ steps.check.outputs.is_critical }}

    steps:
      - name: 📥 استنساخ المستودع
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 إعداد Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: 📦 تثبيت المتطلبات
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest flake8

      - name: 🔎 فحص سريع للكود
        run: |
          flake8 gaara_erp/ --max-line-length=120 --select=E9,F63,F7,F82 --show-source --statistics

      - name: 🧪 اختبارات سريعة
        env:
          DJANGO_SETTINGS_MODULE: gaara_erp.settings
          SECRET_KEY: hotfix-test-key
        run: |
          pytest -v --tb=short -x -q 2>/dev/null || echo "⚠️ بعض الاختبارات فشلت - متابعة للطوارئ"

      - name: 🔢 تحديد إصدار الإصلاح
        id: version
        run: |
          # الحصول على آخر علامة
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")

          # استخراج أرقام الإصدار
          MAJOR=$(echo $LATEST_TAG | sed 's/v//' | cut -d. -f1)
          MINOR=$(echo $LATEST_TAG | sed 's/v//' | cut -d. -f2)
          PATCH=$(echo $LATEST_TAG | sed 's/v//' | cut -d. -f3 | cut -d- -f1)

          # زيادة PATCH
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="v${MAJOR}.${MINOR}.${NEW_PATCH}"

          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "📦 إصدار الإصلاح: $NEW_VERSION"

      - name: 🔍 تحديد مستوى الخطورة
        id: check
        run: |
          # تحديد إذا كان الإصلاح حرج بناءً على الملفات المتغيرة
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")

          IS_CRITICAL="false"
          if echo "$CHANGED_FILES" | grep -qE "(security|auth|payment|login)"; then
            IS_CRITICAL="true"
          fi

          echo "is_critical=$IS_CRITICAL" >> $GITHUB_OUTPUT

      - name: 📦 إنشاء Artifact
        run: |
          mkdir -p dist
          tar -czf dist/hotfix-build.tar.gz \
            --exclude='.git' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='.env*' \
            --exclude='*.sqlite3' \
            gaara_erp/

      - name: 📤 رفع Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hotfix-build
          path: dist/
          retention-days: 7

  # ═══════════════════════════════════════════════════════════════
  # 🧪 نشر للتحقق في Staging (اختياري)
  # ═══════════════════════════════════════════════════════════════
  deploy-staging:
    name: 🧪 التحقق في Staging
    needs: validate
    if: ${{ !inputs.skip_staging }}
    runs-on: ubuntu-latest
    environment:
      name: staging-env
      url: ${{ env.STAGING_URL }}

    steps:
      - name: 📥 تنزيل Artifact
        uses: actions/download-artifact@v4
        with:
          name: hotfix-build
          path: dist/

      - name: 🚀 النشر إلى Staging
        run: |
          echo "🚀 جارٍ نشر الإصلاح إلى Staging للتحقق..."
          echo "📦 الإصدار: ${{ needs.validate.outputs.hotfix_version }}"

          # أوامر النشر الفعلية
          # ssh staging "cd /opt/gaara-erp && ./scripts/deploy.sh"

      - name: 🔍 اختبارات الدخان
        run: |
          echo "🔍 جارٍ التحقق من صحة النشر..."
          sleep 15

          # curl -f ${{ env.STAGING_URL }}/health || exit 1
          # curl -f ${{ env.STAGING_URL }}/api/v1/status || exit 1

          echo "✅ Staging يعمل بشكل صحيح"

      - name: ⏱️ انتظار للتحقق اليدوي
        run: |
          echo "⏳ انتظار 2 دقيقة للتحقق اليدوي..."
          echo "🔗 رابط Staging: ${{ env.STAGING_URL }}"
          sleep 120

  # ═══════════════════════════════════════════════════════════════
  # 🚨 النشر الطارئ للإنتاج
  # ═══════════════════════════════════════════════════════════════
  deploy-production:
    name: 🚨 النشر الطارئ للإنتاج
    needs: [validate, deploy-staging]
    if: always() && needs.validate.result == 'success' && (needs.deploy-staging.result == 'success' || inputs.skip_staging)
    runs-on: ubuntu-latest
    environment:
      name: production-env
      url: ${{ env.PRODUCTION_URL }}

    steps:
      - name: 📥 استنساخ المستودع
        uses: actions/checkout@v4

      - name: 📥 تنزيل Artifact
        uses: actions/download-artifact@v4
        with:
          name: hotfix-build
          path: dist/

      - name: ⚠️ تأكيد الطوارئ
        if: ${{ inputs.skip_staging }}
        run: |
          echo "🚨 تحذير: تم تخطي Staging - هذا نشر طوارئ!"
          echo "📝 السبب: ${{ inputs.hotfix_description }}"

      - name: 💾 إنشاء نسخة احتياطية سريعة
        run: |
          echo "💾 جارٍ إنشاء نسخة احتياطية سريعة..."
          # ssh production "cd /opt/gaara-erp && ./scripts/quick_backup.sh"
          echo "✅ تم إنشاء النسخة الاحتياطية"

      - name: 🚨 النشر الطارئ
        run: |
          VERSION="${{ needs.validate.outputs.hotfix_version }}"
          echo "🚨 طوارئ: جارٍ نشر الإصلاح $VERSION إلى الإنتاج..."

          # أوامر النشر الفعلية
          # ssh production "cd /opt/gaara-erp && \
          #   docker-compose pull && \
          #   docker-compose up -d --no-deps --build app && \
          #   docker-compose exec -T app python manage.py migrate --no-input"

          echo "✅ تم نشر الإصلاح بنجاح!"

      - name: 🔍 التحقق من صحة الإنتاج
        run: |
          echo "🔍 جارٍ التحقق من صحة النشر..."
          sleep 30

          # HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" ${{ env.PRODUCTION_URL }}/health)
          # if [ "$HTTP_STATUS" != "200" ]; then
          #   echo "❌ فشل التحقق: HTTP $HTTP_STATUS"
          #   exit 1
          # fi

          echo "✅ الإنتاج يعمل بشكل صحيح"

      - name: ↩️ التراجع الطارئ (في حالة الفشل)
        if: failure()
        run: |
          echo "❌ فشل النشر - جارٍ التراجع الطارئ..."
          # ssh production "cd /opt/gaara-erp && ./scripts/emergency_rollback.sh"
          echo "✅ تم التراجع إلى الإصدار السابق"

  # ═══════════════════════════════════════════════════════════════
  # 🏷️ إنشاء علامة الإصلاح
  # ═══════════════════════════════════════════════════════════════
  create-tag:
    name: 🏷️ إنشاء علامة الإصلاح
    needs: [validate, deploy-production]
    if: success()
    runs-on: ubuntu-latest

    steps:
      - name: 📥 استنساخ المستودع
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🏷️ إنشاء العلامة
        run: |
          VERSION="${{ needs.validate.outputs.hotfix_version }}"

          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          git tag -a "$VERSION" -m "🚨 Hotfix $VERSION

          إصلاح طارئ للإنتاج

          التغييرات:
          $(git log --oneline -5)
          "

          git push origin "$VERSION"
          echo "✅ تم إنشاء العلامة $VERSION"

      - name: 📝 إنشاء GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.hotfix_version }}
          name: "🚨 إصلاح طارئ ${{ needs.validate.outputs.hotfix_version }}"
          body: |
            ## 🚨 إصلاح طارئ

            **الإصدار:** ${{ needs.validate.outputs.hotfix_version }}
            **المُنفذ:** ${{ github.actor }}
            **التاريخ:** ${{ github.event.head_commit.timestamp || 'N/A' }}

            ### 📋 التغييرات
            ${{ inputs.hotfix_description || 'إصلاح طارئ للإنتاج' }}

            ### ⚠️ ملاحظات
            - هذا إصلاح طارئ تم نشره مباشرة للإنتاج
            - تم اختباره في Staging: ${{ inputs.skip_staging && '❌ تم التخطي' || '✅ نعم' }}
          prerelease: false

  # ═══════════════════════════════════════════════════════════════
  # 🔀 دمج في develop
  # ═══════════════════════════════════════════════════════════════
  merge-to-develop:
    name: 🔀 دمج في develop
    needs: [validate, deploy-production, create-tag]
    if: success()
    runs-on: ubuntu-latest

    steps:
      - name: 📥 استنساخ المستودع
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔀 دمج الإصلاح في develop
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          # محاولة الدمج التلقائي
          git fetch origin develop
          git checkout develop
          git merge origin/${{ github.ref_name }} --no-ff -m "🔀 دمج hotfix ${{ needs.validate.outputs.hotfix_version }} في develop" || {
            echo "⚠️ يوجد تعارض - يتطلب حل يدوي"
            echo "📝 يرجى دمج الفرع ${{ github.ref_name }} في develop يدوياً"
            exit 0
          }

          git push origin develop
          echo "✅ تم دمج الإصلاح في develop"

  # ═══════════════════════════════════════════════════════════════
  # 📢 الإشعارات
  # ═══════════════════════════════════════════════════════════════
  notify:
    name: 📢 إشعارات الطوارئ
    needs: [validate, deploy-production]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: 📢 إشعار Slack
        uses: slackapi/slack-github-action@v1
        continue-on-error: true
        with:
          payload: |
            {
              "text": "${{ needs.deploy-production.result == 'success' && '🚨 ✅' || '🚨 ❌' }} إصلاح طارئ: ${{ needs.deploy-production.result }}",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "🚨 إصلاح طارئ للإنتاج"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*الحالة:*\n${{ needs.deploy-production.result == 'success' && '✅ نجح' || '❌ فشل' }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*الإصدار:*\n`${{ needs.validate.outputs.hotfix_version }}`"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*المُنفذ:*\n${{ github.actor }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*الخطورة:*\n${{ needs.validate.outputs.is_critical == 'true' && '🔴 حرج' || '🟡 عادي' }}"
                    }
                  ]
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*الوصف:*\n${{ inputs.hotfix_description || 'إصلاح طارئ' }}"
                  }
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "🔗 الإنتاج"
                      },
                      "url": "${{ env.PRODUCTION_URL }}"
                    },
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "📋 التفاصيل"
                      },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

  # ═══════════════════════════════════════════════════════════════
  # 📊 ملخص الإصلاح الطارئ
  # ═══════════════════════════════════════════════════════════════
  summary:
    name: 📊 ملخص
    needs: [validate, deploy-staging, deploy-production, create-tag, merge-to-develop]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: 📋 كتابة الملخص
        run: |
          echo "## 🚨 ملخص الإصلاح الطارئ" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 معلومات الإصلاح" >> $GITHUB_STEP_SUMMARY
          echo "- **الإصدار:** \`${{ needs.validate.outputs.hotfix_version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **الفرع:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **المُنفذ:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **الخطورة:** ${{ needs.validate.outputs.is_critical == 'true' && '🔴 حرج' || '🟡 عادي' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📊 حالة المراحل" >> $GITHUB_STEP_SUMMARY
          echo "| المرحلة | الحالة |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🔍 التحقق | ${{ needs.validate.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🧪 Staging | ${{ needs.deploy-staging.result == 'success' && '✅' || (needs.deploy-staging.result == 'skipped' && '⏭️ تم التخطي' || '❌') }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🚨 الإنتاج | ${{ needs.deploy-production.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🏷️ العلامة | ${{ needs.create-tag.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔀 develop | ${{ needs.merge-to-develop.result == 'success' && '✅' || '⚠️' }} |" >> $GITHUB_STEP_SUMMARY
