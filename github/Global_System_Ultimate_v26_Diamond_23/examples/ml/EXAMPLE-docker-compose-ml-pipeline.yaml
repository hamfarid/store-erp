version: '3.8'

services:
  # 1. Tracking Server (MLflow)
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.10.0
    container_name: mlflow_server
    ports:
      - "5000:5000"
    environment:
      - BACKEND_STORE_URI=postgresql://mlflow:mlflow@db:5432/mlflow
      - ARTIFACT_ROOT=s3://mlflow-artifacts/
    depends_on:
      - db
      - minio
    networks:
      - ml-network

  # 2. Database (PostgreSQL)
  db:
    image: postgres:16-alpine
    container_name: ml_db
    environment:
      - POSTGRES_USER=mlflow
      - POSTGRES_PASSWORD=mlflow
      - POSTGRES_DB=mlflow
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - ml-network

  # 3. Object Storage (MinIO - S3 Compatible)
  minio:
    image: minio/minio:RELEASE.2024-01-31T20-20-33Z
    container_name: ml_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - ml-network

  # 4. Model Serving (FastAPI + ONNX)
  model-serving:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.ml-serving
    container_name: model_api
    ports:
      - "8000:8000"
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - MODEL_NAME=churn-prediction
      - MODEL_STAGE=Production
    depends_on:
      - mlflow
    networks:
      - ml-network

  # 5. Monitoring (Prometheus)
  prometheus:
    image: prom/prometheus:v2.49.1
    container_name: ml_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - ml-network

  # 6. Dashboard (Grafana)
  grafana:
    image: grafana/grafana:10.3.1
    container_name: ml_grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - ml-network

networks:
  ml-network:
    driver: bridge

volumes:
  db_data:
  minio_data:
