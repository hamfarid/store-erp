name: CI - Build & Test

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'bugfix/**'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'

jobs:
  # ============================================================
  # التحليل والفحص الأولي (Linting & Static Analysis)
  # ============================================================
  lint-backend:
    name: Lint Backend (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black pylint
          pip install -r requirements.txt -q

      - name: Lint with Flake8
        run: |
          flake8 backend --count --show-source --statistics --exclude=__pycache__,venv

      - name: Format check with Black
        run: |
          black --check backend || echo "Warning: Code formatting issues found"

  lint-frontend:
    name: Lint Frontend (JavaScript/React)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps 2>/dev/null || npm ci

      - name: Check package audit
        run: npm audit --audit-level=moderate || true

  # ============================================================
  # اختبارات الـ Backend
  # ============================================================
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    needs: lint-backend
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: test_store
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov -q
          pip install -r requirements.txt -q

      - name: Run Backend Tests
        run: |
          pytest tests/ -v --cov=backend --cov-report=xml --cov-report=term-missing
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_store
          FLASK_ENV: testing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: backend
          fail_ci_if_error: false

  # ============================================================
  # البناء (Build)
  # ============================================================
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    needs: test-backend
    if: success()

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Validate Python syntax
        run: |
          python -m py_compile backend/*.py

      - name: Build artifact
        run: |
          mkdir -p build/backend
          cp -r backend/* build/backend/
          cp requirements.txt build/

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: build/
          retention-days: 1

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: lint-frontend
    if: success()

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps 2>/dev/null || npm ci

      - name: Build
        run: npm run build 2>/dev/null || echo "No build script"

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: |
            frontend/
            dist/
          retention-days: 1

  # ============================================================
  # الملخص النهائي
  # ============================================================
  ci-status:
    name: CI Status Check
    runs-on: ubuntu-latest
    needs: [lint-backend, lint-frontend, build-backend, build-frontend]
    if: always()
    
    steps:
      - name: Check CI Status
        run: |
          if [ "${{ needs.lint-backend.result }}" = "failure" ] || \
             [ "${{ needs.lint-frontend.result }}" = "failure" ] || \
             [ "${{ needs.build-backend.result }}" = "failure" ] || \
             [ "${{ needs.build-frontend.result }}" = "failure" ]; then
            echo "❌ CI Pipeline Failed"
            exit 1
          else
            echo "✅ CI Pipeline Passed"
          fi
