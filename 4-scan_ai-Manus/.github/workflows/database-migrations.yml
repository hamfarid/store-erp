name: Database Migrations

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'backend/alembic/**'
      - 'backend/src/models/**'
  workflow_dispatch:

jobs:
  validate-migrations:
    name: Validate Database Migrations
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: migration_user
          POSTGRES_PASSWORD: migration_password
          POSTGRES_DB: migration_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install alembic
    
    - name: Check migration scripts
      env:
        DATABASE_URL: postgresql://migration_user:migration_password@localhost:5432/migration_db
      run: |
        cd backend
        alembic check
        alembic current
        alembic upgrade head
      continue-on-error: true
    
    - name: Test rollback
      env:
        DATABASE_URL: postgresql://migration_user:migration_password@localhost:5432/migration_db
      run: |
        cd backend
        alembic downgrade -1
        alembic upgrade head
      continue-on-error: true
