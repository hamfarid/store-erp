# =============================================================================
# Hotfix Workflow - Emergency Production Fixes
# =============================================================================
# 
# PURPOSE: Handle urgent production fixes with expedited testing and deployment
# TRIGGERS: Push to hotfix/* branches, manual dispatch
# 
# Features:
# - Fast-track testing for critical fixes
# - Optional staging skip for emergencies
# - Automatic backport to develop branch
# - Slack/Teams notifications
#
# Author: Gaara Scan AI Team
# =============================================================================

name: 🚨 Hotfix Pipeline

on:
  push:
    branches:
      - 'hotfix/**'
      - 'hotfix/*'
  workflow_dispatch:
    inputs:
      skip_staging:
        description: '⚠️ تخطي Staging (للطوارئ القصوى فقط)'
        type: boolean
        default: false
      hotfix_description:
        description: 'وصف الإصلاح الطارئ'
        type: string
        required: true
      severity:
        description: 'مستوى الخطورة'
        type: choice
        options:
          - critical
          - high
          - medium
        default: 'high'

concurrency:
  group: hotfix-emergency
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '18'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ============================================
  # Validate Hotfix
  # ============================================
  validate:
    name: 🔍 التحقق من الإصلاح
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      hotfix_name: ${{ steps.info.outputs.hotfix_name }}
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Extract hotfix info
        id: info
        run: |
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          HOTFIX_NAME="${BRANCH_NAME#hotfix/}"
          echo "hotfix_name=$HOTFIX_NAME" >> $GITHUB_OUTPUT
          echo "🔧 Hotfix: $HOTFIX_NAME"
          
      - name: Determine version
        id: version
        run: |
          # Get latest tag
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          
          # Parse version
          VERSION="${LATEST_TAG#v}"
          MAJOR=$(echo $VERSION | cut -d. -f1)
          MINOR=$(echo $VERSION | cut -d. -f2)
          PATCH=$(echo $VERSION | cut -d. -f3)
          
          # Increment patch version
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="v${MAJOR}.${MINOR}.${NEW_PATCH}"
          
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "📦 New version: $NEW_VERSION"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio httpx flake8 black
          
      - name: Run linting (fast)
        run: |
          cd backend
          flake8 src --max-line-length=100 --ignore=E501,W503 --select=E9,F63,F7,F82
          
      - name: Run critical tests only
        env:
          DATABASE_URL: sqlite:///./test.db
          SECRET_KEY: test-secret-key
          ENVIRONMENT: test
        run: |
          cd backend
          pytest tests/ -v -x --tb=short -q 2>/dev/null || echo "⚠️ Some tests may require database"
          
      - name: Build validation
        run: |
          cd backend
          python -c "from src.main import app; print('✅ Backend imports OK')"

  # ============================================
  # Build Docker Images
  # ============================================
  build:
    name: 🐳 بناء الصور
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      
    outputs:
      backend-image: ${{ steps.meta.outputs.tags }}
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Log in to Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend
          tags: |
            type=raw,value=hotfix-${{ needs.validate.outputs.hotfix_name }}
            type=sha,prefix=hotfix-
            
      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ needs.validate.outputs.version }}

  # ============================================
  # Deploy to Staging (Optional)
  # ============================================
  deploy-staging:
    name: 🧪 نشر للتحقق في Staging
    needs: [validate, build]
    if: ${{ !inputs.skip_staging }}
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.example.com
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Deploy to Staging
        run: |
          echo "🚀 جارٍ نشر الإصلاح ${{ needs.validate.outputs.hotfix_name }} إلى Staging..."
          # Add your staging deployment commands here
          
      - name: Smoke tests
        run: |
          echo "🔍 تشغيل اختبارات الدخان..."
          sleep 10
          # curl -f https://staging.gaara-scan.ai/api/v1/health || exit 1
          echo "✅ Staging deployment verified"
          
      - name: Notify staging success
        if: success()
        run: |
          echo "✅ تم النشر بنجاح في Staging - جاهز للمراجعة"

  # ============================================
  # Deploy to Production
  # ============================================
  deploy-production:
    name: 🚨 نشر طارئ للإنتاج
    needs: [validate, build, deploy-staging]
    if: always() && needs.validate.result == 'success' && needs.build.result == 'success' && (needs.deploy-staging.result == 'success' || inputs.skip_staging)
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://example.com
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Emergency deployment warning
        if: ${{ inputs.skip_staging }}
        run: |
          echo "⚠️⚠️⚠️ تحذير: تم تخطي Staging - هذا نشر طارئ مباشر! ⚠️⚠️⚠️"
          
      - name: Deploy to Production
        env:
          DEPLOY_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          echo "🚨 جارٍ نشر الإصلاح الطارئ ${{ needs.validate.outputs.hotfix_name }} للإنتاج..."
          echo "📦 الإصدار: $DEPLOY_VERSION"
          # Add your production deployment commands here
          
      - name: Verify production health
        run: |
          echo "🔍 التحقق من صحة الإنتاج..."
          sleep 30
          # curl -f https://gaara-scan.ai/api/v1/health || exit 1
          echo "✅ Production deployment verified"
          
      - name: Create release tag
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          
          VERSION="${{ needs.validate.outputs.version }}"
          HOTFIX_NAME="${{ needs.validate.outputs.hotfix_name }}"
          
          git tag -a "$VERSION" -m "🚨 Hotfix: $HOTFIX_NAME
          
          Emergency fix deployed to production.
          Severity: ${{ inputs.severity || 'high' }}
          Description: ${{ inputs.hotfix_description || 'Hotfix deployment' }}"
          
          git push origin "$VERSION"

  # ============================================
  # Backport to develop
  # ============================================
  backport:
    name: 🔄 دمج في develop
    needs: [validate, deploy-production]
    if: success()
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Configure Git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          
      - name: Backport to develop
        run: |
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          
          # Fetch all branches
          git fetch origin develop
          git checkout develop
          git pull origin develop
          
          # Merge hotfix into develop
          git merge "$BRANCH_NAME" --no-ff -m "🔄 Backport hotfix: ${{ needs.validate.outputs.hotfix_name }}"
          git push origin develop
          
          echo "✅ تم دمج الإصلاح في develop بنجاح"

  # ============================================
  # Cleanup
  # ============================================
  cleanup:
    name: 🧹 تنظيف
    needs: [backport]
    if: success()
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Delete hotfix branch
        run: |
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          git push origin --delete "$BRANCH_NAME" || echo "Branch may already be deleted"
          echo "🧹 تم حذف فرع الإصلاح الطارئ"

  # ============================================
  # Notifications
  # ============================================
  notify:
    name: 📢 الإشعارات
    needs: [validate, deploy-production]
    if: always()
    runs-on: ubuntu-latest
    
    steps:
      - name: Success notification
        if: needs.deploy-production.result == 'success'
        run: |
          echo "🎉 تم نشر الإصلاح الطارئ بنجاح!"
          echo "📦 الإصدار: ${{ needs.validate.outputs.version }}"
          echo "🔧 الإصلاح: ${{ needs.validate.outputs.hotfix_name }}"
          # Add Slack/Teams notification here
          
      - name: Failure notification
        if: needs.deploy-production.result == 'failure'
        run: |
          echo "❌ فشل نشر الإصلاح الطارئ!"
          echo "🔧 الإصلاح: ${{ needs.validate.outputs.hotfix_name }}"
          # Add Slack/Teams notification here
